<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시작점 AI 영어 - 관리자</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Jua&display=swap');
    body {
        font-family: 'Nunito', sans-serif;
        background-color: #F9F6F0;
        color: #5E4B3C;
        margin: 0;
    }
    .brand-title { font-family: 'Jua', sans-serif; }
    .card {
        background: #FFFFFF;
        border-radius: 20px;
        box-shadow: 0 2px 12px rgba(94, 75, 60, 0.08);
    }
    .btn {
        border-radius: 12px;
        font-weight: 800;
        transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #89A8B2; color: white; }
    .btn-primary:hover { background: #7A97A1; }
    .btn-danger { background: #E88C7D; color: white; }
    .btn-danger:hover { background: #DB7A6A; }
    .btn-outline { background: white; border: 2px solid #D8C3A5; color: #8B7355; }
    .btn-outline:hover { background: #F2EAE1; }
    input, select {
        border: 2px solid #E4DACB;
        border-radius: 12px;
        padding: 10px 14px;
        outline: none;
        background: white;
    }
    input:focus { border-color: #89A8B2; }
    .badge { border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800; }
    .badge-locked { background: #FBE1DC; color: #C1503E; }
    .badge-active { background: #E3EEE1; color: #4B8A5A; }
    table { border-collapse: separate; border-spacing: 0; }
    th { text-align: left; font-size: 13px; color: #A0937D; padding: 10px 12px; border-bottom: 2px solid #F2EAE1; }
    td { padding: 12px; border-bottom: 1px solid #F2EAE1; font-size: 14px; }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
    <div class="card p-8 w-full max-w-sm">
        <h1 class="brand-title text-2xl text-center mb-1">시작점 AI 영어</h1>
        <p class="text-center text-sm text-[#A0937D] mb-6">관리자 로그인</p>
        <div class="space-y-3">
            <input id="admin-username" type="text" placeholder="관리자 아이디" class="w-full" autocomplete="username">
            <input id="admin-password" type="password" placeholder="비밀번호" class="w-full" autocomplete="current-password"
                onkeydown="if(event.key==='Enter') adminLogin()">
            <button onclick="adminLogin()" class="btn btn-primary w-full py-3">로그인</button>
            <p id="login-error" class="text-center text-sm font-bold text-red-500 min-h-[20px]"></p>
        </div>
    </div>
</div>

<!-- 관리자 대시보드 화면 -->
<div id="dashboard-screen" class="hidden max-w-5xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="brand-title text-2xl">시작점 AI 영어 - 관리자</h1>
            <p class="text-sm text-[#A0937D]" id="admin-welcome"></p>
        </div>
        <button onclick="adminLogout()" class="btn btn-outline px-4 py-2 text-sm">로그아웃</button>
    </div>

    <!-- 학생 추가 폼 -->
    <div class="card p-6 mb-6">
        <h2 class="font-extrabold text-lg mb-4">새 학생 계정 추가</h2>
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 mb-3">
            <input id="new-username" type="text" placeholder="아이디 (예: minjun01)">
            <input id="new-password" type="text" placeholder="비밀번호">
            <input id="new-display-name" type="text" placeholder="학생 이름">
            <input id="new-class-name" type="text" placeholder="반 이름 (선택)">
        </div>
        <div class="flex items-center gap-3">
            <button onclick="createStudent()" class="btn btn-primary px-5 py-2.5">계정 추가</button>
            <button onclick="fillRandomPassword()" class="btn btn-outline px-4 py-2.5 text-sm">비밀번호 자동생성</button>
            <p id="create-error" class="text-sm font-bold text-red-500"></p>
            <p id="create-success" class="text-sm font-bold text-green-600"></p>
        </div>
    </div>

    <!-- 학생 목록 -->
    <div class="card p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="font-extrabold text-lg">학생 목록</h2>
            <button onclick="loadUsers()" class="text-sm text-[#89A8B2] font-bold">↻ 새로고침</button>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr>
                        <th>이름</th>
                        <th>아이디</th>
                        <th>반</th>
                        <th>상태</th>
                        <th>마지막 로그인</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="user-table-body"></tbody>
            </table>
            <p id="user-list-empty" class="text-center text-[#A0937D] py-8 hidden">아직 등록된 학생이 없어요.</p>
        </div>
    </div>

    <!-- 단어·패턴 관리 -->
    <div class="card p-6 mt-6">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <h2 class="font-extrabold text-lg">단어·패턴 관리</h2>
            <div class="flex items-center gap-2">
                <select id="level-select" onchange="onLevelChange()" class="text-sm font-bold">
                    <option value="start">스타트</option>
                    <option value="basic">베이직</option>
                    <option value="intermediate">인터미디엇</option>
                    <option value="advanced">어드밴스드</option>
                </select>
                <button onclick="loadPatterns()" class="text-sm text-[#89A8B2] font-bold">↻ 새로고침</button>
            </div>
        </div>

        <div class="bg-[#F9F6F0] rounded-2xl p-4 mb-4">
            <p class="text-sm font-bold mb-2">새 패턴 추가</p>
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 mb-2">
                <input id="np-icon" type="text" placeholder="아이콘(이모지)" maxlength="4">
                <input id="np-text" type="text" placeholder="패턴 문구 (예: I want to ~)" class="sm:col-span-2">
                <input id="np-desc" type="text" placeholder="한글 설명 (예: 나는 ~하고 싶어)">
            </div>
            <button onclick="createPattern()" class="btn btn-primary px-4 py-2 text-sm">패턴 추가</button>
            <span id="pattern-create-msg" class="text-sm font-bold ml-2"></span>
        </div>

        <div id="pattern-accordion" class="space-y-3"></div>
    </div>
</div>

<script>
    let adminUser = null;

    async function checkAdminSession() {
        try {
            const res = await fetch('/api/me', { credentials: 'same-origin' });
            if (res.ok) {
                const data = await res.json();
                if (data.ok && data.user.role === 'admin') {
                    adminUser = data.user;
                    showDashboard();
                    return;
                }
            }
        } catch (e) { /* 무시 */ }
        showLogin();
    }

    function showLogin() {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('dashboard-screen').classList.add('hidden');
    }

    function showDashboard() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
        document.getElementById('admin-welcome').innerText = `${adminUser.display_name}님, 환영합니다`;
        loadUsers();
        loadPatterns();
    }

    async function adminLogin() {
        const username = document.getElementById('admin-username').value.trim();
        const password = document.getElementById('admin-password').value;
        const errorEl = document.getElementById('login-error');
        errorEl.innerText = '';

        if (!username || !password) {
            errorEl.innerText = '아이디와 비밀번호를 입력해주세요.';
            return;
        }

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (!data.ok) {
                errorEl.innerText = data.error || '로그인에 실패했어요.';
                return;
            }
            if (data.user.role !== 'admin') {
                errorEl.innerText = '관리자 계정이 아니에요.';
                await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
                return;
            }

            adminUser = data.user;
            showDashboard();
        } catch (e) {
            errorEl.innerText = '연결에 문제가 있어요. 잠시 후 다시 시도해주세요.';
        }
    }

    async function adminLogout() {
        try {
            await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
        } catch (e) { /* 무시 */ }
        adminUser = null;
        showLogin();
    }

    async function loadUsers() {
        try {
            const res = await fetch('/api/admin/list-users', { credentials: 'same-origin' });
            const data = await res.json();
            if (!data.ok) return;

            const tbody = document.getElementById('user-table-body');
            const emptyMsg = document.getElementById('user-list-empty');
            tbody.innerHTML = '';

            const students = data.users.filter(u => u.role !== 'admin');

            if (students.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            }
            emptyMsg.classList.add('hidden');

            students.forEach(u => {
                const tr = document.createElement('tr');
                const lastLogin = u.last_login_at ? new Date(u.last_login_at).toLocaleDateString('ko-KR') : '-';
                const statusBadge = u.is_locked
                    ? `<span class="badge badge-locked">잠김</span>`
                    : `<span class="badge badge-active">정상</span>`;

                tr.innerHTML = `
                    <td class="font-bold">${escapeHtml(u.display_name)}</td>
                    <td class="text-[#A0937D]">${escapeHtml(u.username)}</td>
                    <td>${escapeHtml(u.class_name || '-')}</td>
                    <td>${statusBadge}</td>
                    <td class="text-[#A0937D]">${lastLogin}</td>
                    <td>
                        <div class="flex gap-2">
                            <button onclick="viewProgress(${u.id}, '${escapeHtml(u.display_name)}')" class="btn btn-primary px-3 py-1.5 text-xs">학습현황</button>
                            ${u.is_locked ? `<button onclick="unlockUser(${u.id})" class="btn btn-outline px-3 py-1.5 text-xs">잠금해제</button>` : ''}
                            <button onclick="resetPassword(${u.id}, '${escapeHtml(u.display_name)}')" class="btn btn-outline px-3 py-1.5 text-xs">비밀번호 재설정</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error('학생 목록 불러오기 실패:', e);
        }
    }

    function fillRandomPassword() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
        let pw = '';
        for (let i = 0; i < 8; i++) pw += chars[Math.floor(Math.random() * chars.length)];
        document.getElementById('new-password').value = pw;
    }

    async function createStudent() {
        const username = document.getElementById('new-username').value.trim();
        const password = document.getElementById('new-password').value;
        const display_name = document.getElementById('new-display-name').value.trim();
        const class_name = document.getElementById('new-class-name').value.trim();
        const errorEl = document.getElementById('create-error');
        const successEl = document.getElementById('create-success');
        errorEl.innerText = '';
        successEl.innerText = '';

        if (!username || !password || !display_name) {
            errorEl.innerText = '아이디, 비밀번호, 이름은 꼭 입력해주세요.';
            return;
        }

        try {
            const res = await fetch('/api/admin/create-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ username, password, display_name, class_name })
            });
            const data = await res.json();

            if (!data.ok) {
                errorEl.innerText = data.error || '계정 생성에 실패했어요.';
                return;
            }

            successEl.innerText = `${display_name} 학생 계정이 만들어졌어요! (아이디: ${username})`;
            document.getElementById('new-username').value = '';
            document.getElementById('new-password').value = '';
            document.getElementById('new-display-name').value = '';
            document.getElementById('new-class-name').value = '';
            loadUsers();
        } catch (e) {
            errorEl.innerText = '연결에 문제가 있어요. 잠시 후 다시 시도해주세요.';
        }
    }

    async function unlockUser(userId) {
        if (!confirm('이 학생의 계정 잠금을 해제할까요?')) return;
        try {
            const res = await fetch('/api/admin/unlock-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ user_id: userId })
            });
            const data = await res.json();
            if (data.ok) loadUsers();
            else alert(data.error || '잠금 해제에 실패했어요.');
        } catch (e) {
            alert('연결에 문제가 있어요.');
        }
    }

    async function resetPassword(userId, name) {
        const newPassword = prompt(`${name} 학생의 새 비밀번호를 입력해주세요:`);
        if (!newPassword) return;

        try {
            const res = await fetch('/api/admin/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ user_id: userId, new_password: newPassword })
            });
            const data = await res.json();
            if (data.ok) {
                alert(`비밀번호가 재설정됐어요! (새 비밀번호: ${newPassword})\n학생에게 전달해주세요.`);
                loadUsers();
            } else {
                alert(data.error || '비밀번호 재설정에 실패했어요.');
            }
        } catch (e) {
            alert('연결에 문제가 있어요.');
        }
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // ==============================
    // 단어·패턴 관리
    // ==============================
    let patternsCache = [];
    const expandedPatterns = new Set();

    function getCurrentLevel() {
        const sel = document.getElementById('level-select');
        return sel ? sel.value : 'start';
    }

    function onLevelChange() {
        expandedPatterns.clear();
        loadPatterns();
    }

    async function loadPatterns() {
        try {
            const res = await fetch(`/api/patterns?level=${getCurrentLevel()}`, { credentials: 'same-origin' });
            const data = await res.json();
            if (!data.ok) return;
            patternsCache = data.patterns;
            renderPatternAccordion();
        } catch (e) {
            console.error('패턴 불러오기 실패:', e);
        }
    }

    function renderPatternAccordion() {
        const container = document.getElementById('pattern-accordion');
        container.innerHTML = '';

        patternsCache.forEach(p => {
            const isOpen = expandedPatterns.has(p.id);
            const wrap = document.createElement('div');
            wrap.className = 'border border-[#F2EAE1] rounded-2xl overflow-hidden';

            const sentenceRows = p.sentences.map(s => `
                <div class="flex items-center justify-between gap-2 px-4 py-2 border-b border-[#F2EAE1] last:border-b-0">
                    <div class="text-sm">
                        <span class="font-bold">${escapeHtml(s.eng)}</span>
                        <span class="text-[#A0937D]"> — ${escapeHtml(s.kor)}</span>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button onclick="editSentence(${s.id}, '${escapeHtml(s.eng).replace(/'/g, "\\'")}', '${escapeHtml(s.kor).replace(/'/g, "\\'")}')" class="btn btn-outline px-2 py-1 text-xs">수정</button>
                        <button onclick="deleteSentence(${s.id})" class="btn btn-danger px-2 py-1 text-xs">삭제</button>
                    </div>
                </div>
            `).join('');

            wrap.innerHTML = `
                <button onclick="togglePattern(${p.id})" class="w-full flex items-center justify-between px-4 py-3 bg-[#F9F6F0] text-left">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">${p.icon}</span>
                        <div>
                            <div class="font-extrabold text-sm">${escapeHtml(p.title)}</div>
                            <div class="text-xs text-[#A0937D]">${escapeHtml(p.desc)} · 문장 ${p.sentences.length}개</div>
                        </div>
                    </div>
                    <span class="text-[#A0937D]">${isOpen ? '▲' : '▼'}</span>
                </button>
                <div id="pattern-body-${p.id}" class="${isOpen ? '' : 'hidden'}">
                    <div class="flex justify-end gap-2 px-4 pt-3">
                        <button onclick="editPattern(${p.id}, '${escapeHtml(p.icon)}', '${escapeHtml(p.title.replace(/^Day \\d+:\\s*/, '')).replace(/'/g, "\\'")}', '${escapeHtml(p.desc).replace(/'/g, "\\'")}')" class="btn btn-outline px-3 py-1.5 text-xs">패턴 수정</button>
                        <button onclick="deletePattern(${p.id})" class="btn btn-danger px-3 py-1.5 text-xs">패턴 삭제</button>
                    </div>
                    <div class="mt-2">${sentenceRows || '<p class="text-center text-sm text-[#A0937D] py-4">문장이 없어요.</p>'}</div>
                    <div class="flex gap-2 p-4 bg-[#FCFAF6]">
                        <input id="new-sentence-eng-${p.id}" type="text" placeholder="영어 문장" class="flex-1 text-sm">
                        <input id="new-sentence-kor-${p.id}" type="text" placeholder="한글 뜻" class="flex-1 text-sm">
                        <button onclick="createSentence(${p.id})" class="btn btn-primary px-4 py-2 text-sm shrink-0">문장 추가</button>
                    </div>
                </div>
            `;
            container.appendChild(wrap);
        });
    }

    function togglePattern(id) {
        if (expandedPatterns.has(id)) expandedPatterns.delete(id);
        else expandedPatterns.add(id);
        renderPatternAccordion();
    }

    async function createPattern() {
        const icon = document.getElementById('np-icon').value.trim() || '📘';
        const pattern_text = document.getElementById('np-text').value.trim();
        const desc_text = document.getElementById('np-desc').value.trim();
        const msgEl = document.getElementById('pattern-create-msg');
        msgEl.innerText = '';
        msgEl.className = 'text-sm font-bold ml-2';

        if (!pattern_text) {
            msgEl.innerText = '패턴 문구를 입력해주세요.';
            msgEl.classList.add('text-red-500');
            return;
        }

        try {
            const res = await fetch('/api/admin/create-pattern', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ level_code: getCurrentLevel(), pattern_text, desc_text, icon })
            });
            const data = await res.json();
            if (!data.ok) {
                msgEl.innerText = data.error || '추가에 실패했어요.';
                msgEl.classList.add('text-red-500');
                return;
            }
            msgEl.innerText = '패턴이 추가됐어요!';
            msgEl.classList.add('text-green-600');
            document.getElementById('np-icon').value = '';
            document.getElementById('np-text').value = '';
            document.getElementById('np-desc').value = '';
            loadPatterns();
        } catch (e) {
            msgEl.innerText = '연결에 문제가 있어요.';
            msgEl.classList.add('text-red-500');
        }
    }

    async function editPattern(id, currentIcon, currentText, currentDesc) {
        const icon = prompt('아이콘(이모지)을 입력하세요:', currentIcon);
        if (icon === null) return;
        const pattern_text = prompt('패턴 문구를 입력하세요:', currentText);
        if (pattern_text === null) return;
        const desc_text = prompt('한글 설명을 입력하세요:', currentDesc);
        if (desc_text === null) return;

        try {
            const res = await fetch('/api/admin/update-pattern', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ id, pattern_text, desc_text, icon })
            });
            const data = await res.json();
            if (data.ok) loadPatterns();
            else alert(data.error || '수정에 실패했어요.');
        } catch (e) {
            alert('연결에 문제가 있어요.');
        }
    }

    async function deletePattern(id) {
        if (!confirm('이 패턴과 그 안의 모든 문장이 삭제돼요. 계속할까요?')) return;
        try {
            const res = await fetch('/api/admin/delete-pattern', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ id })
            });
            const data = await res.json();
            if (data.ok) loadPatterns();
            else alert(data.error || '삭제에 실패했어요.');
        } catch (e) {
            alert('연결에 문제가 있어요.');
        }
    }

    async function createSentence(patternId) {
        const engEl = document.getElementById(`new-sentence-eng-${patternId}`);
        const korEl = document.getElementById(`new-sentence-kor-${patternId}`);
        const eng_text = engEl.value.trim();
        const kor_text = korEl.value.trim();

        if (!eng_text || !kor_text) {
            alert('영어 문장과 한글 뜻을 모두 입력해주세요.');
            return;
        }

        try {
            const res = await fetch('/api/admin/create-sentence', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ pattern_id: patternId, eng_text, kor_text })
            });
            const data = await res.json();
            if (data.ok) {
                expandedPatterns.add(patternId);
                loadPatterns();
            } else {
                alert(data.error || '추가에 실패했어요.');
            }
        } catch (e) {
            alert('연결에 문제가 있어요.');
        }
    }

    async function editSentence(id, currentEng, currentKor) {
        const eng_text = prompt('영어 문장을 입력하세요:', currentEng);
        if (eng_text === null) return;
        const kor_text = prompt('한글 뜻을 입력하세요:', currentKor);
        if (kor_text === null) return;

        try {
            const res = await fetch('/api/admin/update-sentence', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ id, eng_text, kor_text })
            });
            const data = await res.json();
            if (data.ok) loadPatterns();
            else alert(data.error || '수정에 실패했어요.');
        } catch (e) {
            alert('연결에 문제가 있어요.');
        }
    }

    async function deleteSentence(id) {
        if (!confirm('이 문장을 삭제할까요?')) return;
        try {
            const res = await fetch('/api/admin/delete-sentence', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ id })
            });
            const data = await res.json();
            if (data.ok) loadPatterns();
            else alert(data.error || '삭제에 실패했어요.');
        } catch (e) {
            alert('연결에 문제가 있어요.');
        }
    }

    let progressModalUserId = null;
    let progressModalUserName = null;

    async function viewProgress(userId, name) {
        progressModalUserId = userId;
        progressModalUserName = name;
        const modal = document.getElementById('progress-modal');
        document.getElementById('progress-modal-title').innerText = `${name} 학생의 학습 현황`;
        modal.classList.remove('hidden');
        await loadProgressData(getCurrentLevel());
    }

    async function loadProgressData(levelCode) {
        const body = document.getElementById('progress-modal-body');
        body.innerHTML = '<p class="text-center text-[#A0937D] py-8">불러오는 중...</p>';

        try {
            const res = await fetch(`/api/admin/student-progress?user_id=${progressModalUserId}&level=${levelCode}`, { credentials: 'same-origin' });
            const data = await res.json();
            if (!data.ok) {
                body.innerHTML = `<p class="text-center text-red-500 py-8">${escapeHtml(data.error || '불러오기에 실패했어요.')}</p>`;
                return;
            }

            const totalSentences = data.byPattern.reduce((sum, p) => sum + p.total_sentences, 0);
            const totalCompleted = data.byPattern.reduce((sum, p) => sum + p.completed_sentences, 0);
            const overallPct = totalSentences ? Math.round((totalCompleted / totalSentences) * 100) : 0;
            const passRate = data.summary.total_attempts
                ? Math.round((data.summary.pass_attempts / data.summary.total_attempts) * 100)
                : 0;

            let html = `
                <div class="flex items-center justify-between mb-3">
                    <span class="text-sm font-bold text-[#5E4B3C]">단계 선택</span>
                    <select onchange="loadProgressData(this.value)" class="text-sm">
                        <option value="start" ${levelCode === 'start' ? 'selected' : ''}>스타트</option>
                        <option value="basic" ${levelCode === 'basic' ? 'selected' : ''}>베이직</option>
                        <option value="intermediate" ${levelCode === 'intermediate' ? 'selected' : ''}>인터미디엇</option>
                        <option value="advanced" ${levelCode === 'advanced' ? 'selected' : ''}>어드밴스드</option>
                    </select>
                </div>
                <div class="bg-[#F9F6F0] rounded-2xl p-4 mb-4 flex gap-6">
                    <div>
                        <div class="text-2xl font-extrabold text-[#89A8B2]">${totalCompleted}/${totalSentences}</div>
                        <div class="text-xs text-[#A0937D]">전체 완료 문장 (${overallPct}%)</div>
                    </div>
                    <div>
                        <div class="text-2xl font-extrabold text-[#89A8B2]">${passRate}%</div>
                        <div class="text-xs text-[#A0937D]">발음 통과율 (총 ${data.summary.total_attempts}회 시도)</div>
                    </div>
                </div>
                <p class="text-sm font-bold mb-2">패턴별 진도</p>
                <div class="space-y-2 mb-4">
            `;

            data.byPattern.forEach(p => {
                const pct = p.total_sentences ? Math.round((p.completed_sentences / p.total_sentences) * 100) : 0;
                html += `
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span>${p.icon} ${escapeHtml(p.pattern_text)}</span>
                            <span class="text-[#A0937D]">${p.completed_sentences}/${p.total_sentences}</span>
                        </div>
                        <div class="w-full h-2 bg-[#F2EAE1] rounded-full overflow-hidden">
                            <div class="h-full bg-[#89A8B2]" style="width:${pct}%"></div>
                        </div>
                    </div>
                `;
            });

            if (data.byPattern.length === 0) {
                html += `<p class="text-sm text-[#A0937D] py-2">이 단계에는 아직 등록된 패턴이 없어요.</p>`;
            }

            html += `</div><p class="text-sm font-bold mb-2">최근 학습 활동</p>`;
            if (data.recent.length === 0) {
                html += `<p class="text-sm text-[#A0937D]">아직 학습 기록이 없어요.</p>`;
            } else {
                html += `<div class="space-y-1">`;
                data.recent.forEach(r => {
                    const time = new Date(r.created_at).toLocaleString('ko-KR');
                    const mark = r.is_pass ? '✅' : '❌';
                    html += `<div class="text-xs text-[#A0937D]">${mark} ${escapeHtml(r.eng_text)} <span class="opacity-70">(${time})</span></div>`;
                });
                html += `</div>`;
            }

            body.innerHTML = html;
        } catch (e) {
            body.innerHTML = '<p class="text-center text-red-500 py-8">연결에 문제가 있어요.</p>';
        }
    }

    function closeProgressModal() {
        document.getElementById('progress-modal').classList.add('hidden');
    }

    checkAdminSession();
</script>
    <!-- 학습 현황 모달 -->
    <div id="progress-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center px-4">
        <div class="card p-6 w-full max-w-lg max-h-[85vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-extrabold text-lg" id="progress-modal-title">학습 현황</h3>
                <button onclick="closeProgressModal()" class="text-[#A0937D] text-xl">✕</button>
            </div>
            <div id="progress-modal-body"></div>
        </div>
    </div>

</body>
</html>
